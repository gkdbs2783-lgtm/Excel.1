<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --income: #10b981;
      --expense: #ef4444;
      --primary: #2563eb;
      --shadow: 0 8px 20px rgba(0,0,0,0.06);
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
    }

    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .screen-switch {
      display: inline-flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .switch-btn, .primary-btn, .ghost-btn, .danger-btn {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .switch-btn.active,
    .primary-btn {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .primary-btn { padding: 10px 16px; }
    .ghost-btn { background: #f8fafc; }
    .danger-btn {
      background: rgba(239, 68, 68, 0.08);
      color: var(--expense);
      border-color: rgba(239,68,68,0.12);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
    }

    .card .label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .income .value { color: var(--income); }
    .expense .value { color: var(--expense); }
    .balance .value { color: var(--primary); }

    .content {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 1.2rem;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
      background: white;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.15);
      border-color: var(--primary);
    }

    .type-row {
      display: flex;
      gap: 10px;
    }

    .type-row button {
      flex: 1;
      border: 1px solid var(--line);
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .type-row button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .submit-btn {
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-btn:hover,
    .switch-btn:hover,
    .primary-btn:hover,
    .ghost-btn:hover,
    .danger-btn:hover {
      filter: brightness(0.98);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      background: #f8fafc;
    }

    tbody tr:hover {
      background: #fafcff;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .tag.income {
      background: rgba(16, 185, 129, 0.12);
      color: var(--income);
    }

    .tag.expense {
      background: rgba(239, 68, 68, 0.12);
      color: var(--expense);
    }

    .amount.income { color: var(--income); font-weight: 700; }
    .amount.expense { color: var(--expense); font-weight: 700; }

    .delete-btn {
      border: none;
      background: rgba(239, 68, 68, 0.08);
      color: var(--expense);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 10px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .overview-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .overview-controls .controls-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .overview-controls label {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .overview-controls select {
      min-width: 120px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .overview-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .sheet-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-toolbar .left-tools,
    .sheet-toolbar .right-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .sheet-grid-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .sheet-grid {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      table-layout: fixed;
    }

    .sheet-grid th,
    .sheet-grid td {
      border: 1px solid var(--line);
      padding: 0;
      height: 44px;
      background: #fff;
    }

    .sheet-grid th {
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      width: 110px;
      min-width: 110px;
    }

    .sheet-grid td {
      width: 110px;
    }

    .sheet-grid input {
      width: 100%;
      height: 100%;
      border: none;
      padding: 10px 12px;
      font-size: 0.95rem;
      background: transparent;
      color: var(--text);
      outline: none;
    }

    .sheet-grid input:focus {
      background: #f4f8ff;
      box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .sheet-grid .formula-cell {
      background: #f9fbff;
      color: var(--primary);
      font-weight: 700;
    }

    .sheet-summary {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .summary-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 12px;
    }

    .backup-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 16px;
      overflow: hidden;
    }

    .backup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .backup-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    textarea.backup-box {
      width: 100%;
      min-height: 160px;
      border: none;
      resize: vertical;
      padding: 14px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      background: #f9fafb;
    }

    @media (max-width: 860px) {
      .summary { grid-template-columns: 1fr; }
      .content { grid-template-columns: 1fr; }
      .overview-btn {
        width: 100%;
      }
      .topbar {
        align-items: flex-start;
      }
      .screen-switch {
        width: 100%;
      }
      .switch-btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title-wrap">
        <h1>가계부</h1>
      </div>
      <div class="screen-switch">
        <button type="button" class="switch-btn active" data-screen="main">입력 화면</button>
        <button type="button" class="switch-btn" data-screen="overview">전체 표 화면</button>
      </div>
    </div>

    <section id="mainScreen" class="screen active">
      <div class="summary">
        <div class="card income">
          <div class="label">수입</div>
          <div class="value" id="incomeTotal">0원</div>
        </div>
        <div class="card expense">
          <div class="label">지출</div>
          <div class="value" id="expenseTotal">0원</div>
        </div>
        <div class="card balance">
          <div class="label">잔액</div>
          <div class="value" id="balanceTotal">0원</div>
        </div>
      </div>

      <div class="content">
        <section class="panel">
          <h2>내역 추가</h2>

          <form id="ledgerForm" class="form-grid">
            <div class="field">
              <label for="date">날짜</label>
              <input type="date" id="date" required />
            </div>

            <div class="field">
              <label>유형</label>
              <div class="type-row">
                <button type="button" class="type-btn active" data-type="income">수입</button>
                <button type="button" class="type-btn" data-type="expense">지출</button>
              </div>
            </div>

            <div class="field">
              <label for="category">분류</label>
              <select id="category" required>
                <option value="급여">급여</option>
                <option value="부업">부업</option>
                <option value="식비">식비</option>
                <option value="교통">교통</option>
                <option value="주거">주거</option>
                <option value="쇼핑">쇼핑</option>
                <option value="통신">통신</option>
                <option value="의료">의료</option>
                <option value="교육">교육</option>
                <option value="기타">기타</option>
              </select>
            </div>

            <div class="field">
              <label for="amount">금액</label>
              <input type="number" id="amount" min="1" step="1" placeholder="예: 50000" required />
            </div>

            <div class="field">
              <label for="memo">메모</label>
              <input type="text" id="memo" maxlength="50" placeholder="예: 점심 식사" />
            </div>

            <button type="submit" class="submit-btn">추가하기</button>
          </form>

          <div class="backup-card">
            <div class="backup-header">
              <strong>데이터 백업</strong>
              <div class="backup-actions">
                <button type="button" class="primary-btn" id="backupBtn">백업 생성</button>
                <button type="button" class="ghost-btn" id="restoreBtn">복원</button>
              </div>
            </div>
            <textarea id="backupBox" class="backup-box" placeholder="백업 데이터를 여기에 붙여 넣고 복원 버튼을 누르세요."></textarea>
          </div>
        </section>

        <section class="panel">
          <h2>거래 내역</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>날짜</th>
                  <th>유형</th>
                  <th>분류</th>
                  <th>메모</th>
                  <th>금액</th>
                  <th>삭제</th>
                </tr>
              </thead>
              <tbody id="ledgerTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>

    <section id="overviewScreen" class="screen">
      <div class="overview-panel">
        <div class="overview-controls">
          <div class="controls-group">
            <button type="button" class="ghost-btn" id="sheetAddRowBtn">행 추가</button>
            <button type="button" class="ghost-btn" id="sheetAddColBtn">열 추가</button>
            <button type="button" class="ghost-btn" id="sheetResetBtn">초기화</button>
          </div>
          <div class="controls-group">
            <button type="button" class="ghost-btn" id="backToMainBtn">입력 화면으로</button>
          </div>
        </div>

        <div id="overviewContent"></div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "ledger_entries_v1";
    const form = document.getElementById("ledgerForm");
    const typeButtons = document.querySelectorAll(".type-btn");
    const tableBody = document.getElementById("ledgerTableBody");
    const dateInput = document.getElementById("date");
    const categoryInput = document.getElementById("category");
    const amountInput = document.getElementById("amount");
    const memoInput = document.getElementById("memo");
    const overviewContent = document.getElementById("overviewContent");
    const backupBox = document.getElementById("backupBox");
    const backupBtn = document.getElementById("backupBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const mainScreen = document.getElementById("mainScreen");
    const overviewScreen = document.getElementById("overviewScreen");
    const switchButtons = document.querySelectorAll(".switch-btn");
    const backToMainBtn = document.getElementById("backToMainBtn");

    let selectedType = "income";
    let spreadsheetState = createSheetState(6, 4);

    dateInput.value = new Date().toISOString().slice(0, 10);

    function safeStorageGet() {
      try {
        return window.localStorage;
      } catch (error) {
        return {
          store: {},
          getItem(key) { return this.store[key] ?? null; },
          setItem(key, value) { this.store[key] = String(value); },
          removeItem(key) { delete this.store[key]; }
        };
      }
    }

    function loadEntries() {
      const storage = safeStorageGet();
      const raw = storage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveEntries(entries) {
      const storage = safeStorageGet();
      storage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function showScreen(screenName) {
      const isMain = screenName === "main";
      mainScreen.classList.toggle("active", isMain);
      overviewScreen.classList.toggle("active", !isMain);
      switchButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.screen === screenName);
      });
    }

    switchButtons.forEach(button => {
      button.addEventListener("click", () => showScreen(button.dataset.screen));
    });

    backToMainBtn.addEventListener("click", () => showScreen("main"));

    function formatCurrency(value) {
      return new Intl.NumberFormat("ko-KR", {
        style: "currency",
        currency: "KRW",
        maximumFractionDigits: 0
      }).format(Number(value) || 0);
    }

    function getEntries() {
      return loadEntries().sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function updateTypeButtons() {
      typeButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.type === selectedType);
      });
    }

    typeButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedType = button.dataset.type;
        updateTypeButtons();
      });
    });

    function renderSummary(entries) {
      const income = entries
        .filter(item => item.type === "income")
        .reduce((sum, item) => sum + Number(item.amount), 0);

      const expense = entries
        .filter(item => item.type === "expense")
        .reduce((sum, item) => sum + Number(item.amount), 0);

      const balance = income - expense;

      document.getElementById("incomeTotal").textContent = formatCurrency(income);
      document.getElementById("expenseTotal").textContent = formatCurrency(expense);
      document.getElementById("balanceTotal").textContent = formatCurrency(balance);
    }

    function renderTable() {
      const entries = getEntries();
      tableBody.innerHTML = "";

      if (!entries.length) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="empty">아직 저장된 내역이 없습니다.</td>
          </tr>
        `;
        return;
      }

      entries.forEach(entry => {
        const row = document.createElement("tr");
        const typeClass = entry.type === "income" ? "income" : "expense";
        const sign = entry.type === "income" ? "+" : "-";

        row.innerHTML = `
          <td>${entry.date}</td>
          <td><span class="tag ${typeClass}">${entry.type === "income" ? "수입" : "지출"}</span></td>
          <td>${entry.category}</td>
          <td>${entry.memo || "-"}</td>
          <td class="amount ${typeClass}">${sign}${formatCurrency(Number(entry.amount))}</td>
          <td><button class="delete-btn" data-id="${entry.id}">삭제</button></td>
        `;

        tableBody.appendChild(row);
      });

      document.querySelectorAll(".delete-btn").forEach(button => {
        button.addEventListener("click", (event) => {
          const targetId = Number(event.currentTarget.dataset.id);
          const entries = getEntries();
          const filtered = entries.filter(item => item.id !== targetId);
          saveEntries(filtered);
          render();
        });
      });
    }

    function createSheetState(rows = 6, cols = 4) {
      return Array.from({ length: rows }, () => Array.from({ length: cols }, () => ""));
    }

    function colToLetter(col) {
      let result = "";
      let current = col + 1;
      while (current > 0) {
        const remainder = (current - 1) % 26;
        result = String.fromCharCode(65 + remainder) + result;
        current = Math.floor((current - 1) / 26);
      }
      return result;
    }

    function coordToIndex(cellRef) {
      const match = /^([A-Z]+)([0-9]+)$/i.exec(cellRef.trim());
      if (!match) return null;
      const col = match[1].toUpperCase();
      const row = Number(match[2]);
      return { row: row - 1, col: col.split("").reduce((sum, ch) => sum * 26 + (ch.charCodeAt(0) - 64), 0) - 1 };
    }

    function getCellValue(row, col, seen = new Set()) {
      const key = `${row}:${col}`;
      if (seen.has(key)) return 0;
      seen.add(key);

      const raw = spreadsheetState[row]?.[col] ?? "";
      if (raw === "") return 0;

      const value = String(raw).trim();
      if (!value.startsWith("=")) {
        const num = Number(value.replace(/,/g, ""));
        return Number.isFinite(num) ? num : 0;
      }

      return evaluateFormula(value, row, col, seen);
    }

    function evaluateFormula(formula, row, col, seen) {
      const expr = formula.slice(1).trim();

      const fnMatch = /^([A-Z]+)\s*\((.*)\)\s*$/i.exec(expr);
      if (fnMatch) {
        const fnName = fnMatch[1].toUpperCase();
        const argsRaw = fnMatch[2];
        const args = splitFormulaArgs(argsRaw);

        const values = [];
        args.forEach(arg => {
          const trimmed = arg.trim();
          if (trimmed === "") return;
          if (trimmed.includes(":")) {
            const range = parseRange(trimmed);
            range.forEach(cell => values.push(getCellValue(cell.row, cell.col, new Set(seen))));
            return;
          }
          if (/^[A-Z]+[0-9]+$/i.test(trimmed)) {
            const index = coordToIndex(trimmed);
            if (index) values.push(getCellValue(index.row, index.col, new Set(seen)));
            return;
          }
          const num = Number(trimmed);
          values.push(Number.isFinite(num) ? num : 0);
        });

        if (fnName === "SUM") return values.reduce((sum, value) => sum + value, 0);
        if (fnName === "AVERAGE") return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
        if (fnName === "MIN") return values.length ? Math.min(...values) : 0;
        if (fnName === "MAX") return values.length ? Math.max(...values) : 0;
      }

      let jsExpression = expr;
      jsExpression = jsExpression.replace(/([A-Z]+[0-9]+)/gi, (match) => {
        const idx = coordToIndex(match);
        if (!idx) return "0";
        return String(getCellValue(idx.row, idx.col, new Set(seen)));
      });

      try {
        const result = Function(`"use strict"; return (${jsExpression});`)();
        return Number.isFinite(result) ? result : 0;
      } catch (error) {
        return 0;
      }
    }

    function splitFormulaArgs(rawArgs) {
      const result = [];
      let current = "";
      let depth = 0;
      for (let i = 0; i < rawArgs.length; i++) {
        const ch = rawArgs[i];
        if (ch === "(") depth++;
        if (ch === ")") depth--;
        if (ch === "," && depth === 0) {
          result.push(current);
          current = "";
          continue;
        }
        current += ch;
      }
      if (current.trim() !== "") result.push(current);
      return result;
    }

    function parseRange(rangeText) {
      const match = /^([A-Z]+[0-9]+):([A-Z]+[0-9]+)$/i.exec(rangeText.trim());
      if (!match) return [];

      const start = coordToIndex(match[1]);
      const end = coordToIndex(match[2]);
      if (!start || !end) return [];

      const cells = [];
      const startRow = Math.min(start.row, end.row);
      const endRow = Math.max(start.row, end.row);
      const startCol = Math.min(start.col, end.col);
      const endCol = Math.max(start.col, end.col);

      for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
          cells.push({ row: r, col: c });
        }
      }
      return cells;
    }

    function getCellDisplayValue(row, col) {
      const raw = spreadsheetState[row]?.[col] ?? "";
      if (raw === "") return "";
      if (!String(raw).trim().startsWith("=")) return raw;
      const value = getCellValue(row, col, new Set());
      return Number.isFinite(value) ? value : 0;
    }

    function renderSpreadsheet() {
      const table = document.createElement("table");
      table.className = "sheet-grid";

      const headerRow = document.createElement("tr");
      const blankHeader = document.createElement("th");
      blankHeader.textContent = "";
      headerRow.appendChild(blankHeader);

      for (let col = 0; col < spreadsheetState[0].length; col++) {
        const th = document.createElement("th");
        th.textContent = colToLetter(col);
        headerRow.appendChild(th);
      }
      table.appendChild(headerRow);

      for (let row = 0; row < spreadsheetState.length; row++) {
        const tr = document.createElement("tr");
        const rowLabel = document.createElement("th");
        rowLabel.textContent = String(row + 1);
        tr.appendChild(rowLabel);

        for (let col = 0; col < spreadsheetState[row].length; col++) {
          const td = document.createElement("td");
          const input = document.createElement("input");
          const rawValue = spreadsheetState[row][col];
          const displayValue = getCellDisplayValue(row, col);
          input.value = rawValue || (typeof displayValue === "number" ? String(displayValue) : "");
          input.dataset.row = String(row);
          input.dataset.col = String(col);
          if (String(rawValue).trim().startsWith("=")) {
            input.classList.add("formula-cell");
          }

          input.addEventListener("change", (event) => {
            const target = event.target;
            spreadsheetState[row][col] = target.value;
            renderSpreadsheet();
          });

          td.appendChild(input);
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }

      overviewContent.innerHTML = `
        <div class="sheet-toolbar">
          <div class="left-tools">
            <span class="summary-chip">행 ${spreadsheetState.length}</span>
            <span class="summary-chip">열 ${spreadsheetState[0].length}</span>
          </div>
          <div class="right-tools">
            <span class="summary-chip">수식 예: =A1+B1 / =SUM(A1:A3)</span>
          </div>
        </div>
        <div class="sheet-grid-wrap"></div>
        <div id="sheetSummary" class="sheet-summary"></div>
      `;

      overviewContent.querySelector(".sheet-grid-wrap").appendChild(table);
      renderSheetSummary();
    }

    function renderSheetSummary() {
      const summary = document.getElementById("sheetSummary");
      if (!summary) return;

      let total = 0;
      let formulaCount = 0;
      spreadsheetState.forEach(row => {
        row.forEach(value => {
          if (String(value).trim().startsWith("=")) formulaCount += 1;
          const num = Number(String(value).trim().replace(/,/g, ""));
          if (Number.isFinite(num)) total += num;
        });
      });

      summary.innerHTML = `
        <span class="summary-chip">입력 셀 합계: ${formatCurrency(total)}</span>
        <span class="summary-chip">수식 셀 수: ${formulaCount}</span>
      `;
    }

    document.getElementById("sheetAddRowBtn").addEventListener("click", () => {
      spreadsheetState.push(Array.from({ length: spreadsheetState[0].length }, () => ""));
      renderSpreadsheet();
    });

    document.getElementById("sheetAddColBtn").addEventListener("click", () => {
      spreadsheetState.forEach(row => row.push(""));
      renderSpreadsheet();
    });

    document.getElementById("sheetResetBtn").addEventListener("click", () => {
      spreadsheetState = createSheetState(6, 4);
      renderSpreadsheet();
    });

    function render() {
      const entries = getEntries();
      renderSummary(entries);
      renderTable();
      renderSpreadsheet();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const date = dateInput.value;
      const category = categoryInput.value.trim();
      const amount = Number(amountInput.value);
      const memo = memoInput.value.trim();

      if (!date || !category || !amount || amount <= 0) {
        return;
      }

      const entries = loadEntries();
      entries.push({
        id: Date.now(),
        date,
        type: selectedType,
        category,
        amount,
        memo
      });

      saveEntries(entries);
      form.reset();
      dateInput.value = new Date().toISOString().slice(0, 10);
      selectedType = "income";
      updateTypeButtons();
      render();
    });

    backupBtn.addEventListener("click", () => {
      const entries = getEntries();
      backupBox.value = JSON.stringify(entries, null, 2);
    });

    restoreBtn.addEventListener("click", () => {
      const text = backupBox.value.trim();
      if (!text) {
        alert("복원할 백업 데이터를 입력해주세요.");
        return;
      }

      try {
        const parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) {
          throw new Error("배열 형식이 아닙니다.");
        }
        saveEntries(parsed);
        render();
        alert("데이터를 복원했습니다.");
      } catch (error) {
        alert("백업 데이터 형식이 올바르지 않습니다.");
      }
    });

    updateTypeButtons();
    render();
  </script>
</body>
</html>
