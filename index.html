<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --income: #10b981;
      --expense: #ef4444;
      --primary: #2563eb;
      --shadow: 0 8px 20px rgba(0,0,0,0.06);
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
    }

    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .screen-switch {
      display: inline-flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .switch-btn, .primary-btn, .ghost-btn, .danger-btn {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .switch-btn.active,
    .primary-btn {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .primary-btn { padding: 10px 16px; }
    .ghost-btn { background: #f8fafc; }
    .danger-btn {
      background: rgba(239, 68, 68, 0.08);
      color: var(--expense);
      border-color: rgba(239,68,68,0.12);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
    }

    .card .label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .income .value { color: var(--income); }
    .expense .value { color: var(--expense); }
    .balance .value { color: var(--primary); }

    .content {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 1.2rem;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
      background: white;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.15);
      border-color: var(--primary);
    }

    .type-row {
      display: flex;
      gap: 10px;
    }

    .type-row button {
      flex: 1;
      border: 1px solid var(--line);
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .type-row button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .submit-btn {
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-btn:hover,
    .switch-btn:hover,
    .primary-btn:hover,
    .ghost-btn:hover,
    .danger-btn:hover {
      filter: brightness(0.98);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      background: #f8fafc;
    }

    tbody tr:hover {
      background: #fafcff;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .tag.income {
      background: rgba(16, 185, 129, 0.12);
      color: var(--income);
    }

    .tag.expense {
      background: rgba(239, 68, 68, 0.12);
      color: var(--expense);
    }

    .amount.income { color: var(--income); font-weight: 700; }
    .amount.expense { color: var(--expense); font-weight: 700; }

    .delete-btn {
      border: none;
      background: rgba(239, 68, 68, 0.08);
      color: var(--expense);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 10px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .overview-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .overview-controls .controls-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .overview-controls label {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .overview-controls select {
      min-width: 120px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .overview-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .formula-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .formula-box {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      padding: 14px 16px;
      min-height: 110px;
    }

    .formula-box .formula-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .formula-box .formula-expression {
      display: block;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .formula-box .formula-result {
      display: block;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
    }

    .spreadsheet-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }

    .spreadsheet-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 820px;
    }

    .spreadsheet-table th,
    .spreadsheet-table td {
      border-bottom: 1px solid var(--line);
      padding: 12px 10px;
      white-space: nowrap;
    }

    .spreadsheet-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8fafc;
    }

    .spreadsheet-table .calc-cell {
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.83rem;
      background: #fafcff;
    }

    .spreadsheet-table .total-row {
      background: #eef6ff;
      font-weight: 800;
    }

    .backup-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 16px;
      overflow: hidden;
    }

    .backup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .backup-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    textarea.backup-box {
      width: 100%;
      min-height: 160px;
      border: none;
      resize: vertical;
      padding: 14px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      background: #f9fafb;
    }

    @media (max-width: 860px) {
      .summary { grid-template-columns: 1fr; }
      .content { grid-template-columns: 1fr; }
      .overview-btn {
        width: 100%;
      }
      .topbar {
        align-items: flex-start;
      }
      .screen-switch {
        width: 100%;
      }
      .switch-btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title-wrap">
        <h1>가계부</h1>
      </div>
      <div class="screen-switch">
        <button type="button" class="switch-btn active" data-screen="main">입력 화면</button>
        <button type="button" class="switch-btn" data-screen="overview">전체 표 화면</button>
      </div>
    </div>

    <section id="mainScreen" class="screen active">
      <div class="summary">
        <div class="card income">
          <div class="label">수입</div>
          <div class="value" id="incomeTotal">0원</div>
        </div>
        <div class="card expense">
          <div class="label">지출</div>
          <div class="value" id="expenseTotal">0원</div>
        </div>
        <div class="card balance">
          <div class="label">잔액</div>
          <div class="value" id="balanceTotal">0원</div>
        </div>
      </div>

      <div class="content">
        <section class="panel">
          <h2>내역 추가</h2>

          <form id="ledgerForm" class="form-grid">
            <div class="field">
              <label for="date">날짜</label>
              <input type="date" id="date" required />
            </div>

            <div class="field">
              <label>유형</label>
              <div class="type-row">
                <button type="button" class="type-btn active" data-type="income">수입</button>
                <button type="button" class="type-btn" data-type="expense">지출</button>
              </div>
            </div>

            <div class="field">
              <label for="category">분류</label>
              <select id="category" required>
                <option value="급여">급여</option>
                <option value="부업">부업</option>
                <option value="식비">식비</option>
                <option value="교통">교통</option>
                <option value="주거">주거</option>
                <option value="쇼핑">쇼핑</option>
                <option value="통신">통신</option>
                <option value="의료">의료</option>
                <option value="교육">교육</option>
                <option value="기타">기타</option>
              </select>
            </div>

            <div class="field">
              <label for="amount">금액</label>
              <input type="number" id="amount" min="1" step="1" placeholder="예: 50000" required />
            </div>

            <div class="field">
              <label for="memo">메모</label>
              <input type="text" id="memo" maxlength="50" placeholder="예: 점심 식사" />
            </div>

            <button type="submit" class="submit-btn">추가하기</button>
          </form>

          <div class="backup-card">
            <div class="backup-header">
              <strong>데이터 백업</strong>
              <div class="backup-actions">
                <button type="button" class="primary-btn" id="backupBtn">백업 생성</button>
                <button type="button" class="ghost-btn" id="restoreBtn">복원</button>
              </div>
            </div>
            <textarea id="backupBox" class="backup-box" placeholder="백업 데이터를 여기에 붙여 넣고 복원 버튼을 누르세요."></textarea>
          </div>
        </section>

        <section class="panel">
          <h2>거래 내역</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>날짜</th>
                  <th>유형</th>
                  <th>분류</th>
                  <th>메모</th>
                  <th>금액</th>
                  <th>삭제</th>
                </tr>
              </thead>
              <tbody id="ledgerTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>

    <section id="overviewScreen" class="screen">
      <div class="overview-panel">
        <div class="overview-controls">
          <div class="controls-group">
            <label for="yearFilter">연도</label>
            <select id="yearFilter">
              <option value="all">전체</option>
            </select>
            <label for="monthFilter">월</label>
            <select id="monthFilter">
              <option value="all">전체</option>
              <option value="01">1월</option>
              <option value="02">2월</option>
              <option value="03">3월</option>
              <option value="04">4월</option>
              <option value="05">5월</option>
              <option value="06">6월</option>
              <option value="07">7월</option>
              <option value="08">8월</option>
              <option value="09">9월</option>
              <option value="10">10월</option>
              <option value="11">11월</option>
              <option value="12">12월</option>
            </select>
          </div>
          <div class="controls-group">
            <button type="button" class="ghost-btn" id="backToMainBtn">입력 화면으로</button>
          </div>
        </div>

        <div id="overviewContent"></div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "ledger_entries_v1";
    const form = document.getElementById("ledgerForm");
    const typeButtons = document.querySelectorAll(".type-btn");
    const tableBody = document.getElementById("ledgerTableBody");
    const dateInput = document.getElementById("date");
    const categoryInput = document.getElementById("category");
    const amountInput = document.getElementById("amount");
    const memoInput = document.getElementById("memo");
    const yearFilter = document.getElementById("yearFilter");
    const monthFilter = document.getElementById("monthFilter");
    const overviewContent = document.getElementById("overviewContent");
    const backupBox = document.getElementById("backupBox");
    const backupBtn = document.getElementById("backupBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const mainScreen = document.getElementById("mainScreen");
    const overviewScreen = document.getElementById("overviewScreen");
    const switchButtons = document.querySelectorAll(".switch-btn");
    const backToMainBtn = document.getElementById("backToMainBtn");

    let selectedType = "income";

    dateInput.value = new Date().toISOString().slice(0, 10);

    function safeStorageGet() {
      try {
        return window.localStorage;
      } catch (error) {
        return {
          store: {},
          getItem(key) { return this.store[key] ?? null; },
          setItem(key, value) { this.store[key] = String(value); },
          removeItem(key) { delete this.store[key]; }
        };
      }
    }

    function loadEntries() {
      const storage = safeStorageGet();
      const raw = storage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveEntries(entries) {
      const storage = safeStorageGet();
      storage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function showScreen(screenName) {
      const isMain = screenName === "main";
      mainScreen.classList.toggle("active", isMain);
      overviewScreen.classList.toggle("active", !isMain);
      switchButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.screen === screenName);
      });
    }

    switchButtons.forEach(button => {
      button.addEventListener("click", () => showScreen(button.dataset.screen));
    });

    backToMainBtn.addEventListener("click", () => showScreen("main"));

    function formatCurrency(value) {
      return new Intl.NumberFormat("ko-KR", {
        style: "currency",
        currency: "KRW",
        maximumFractionDigits: 0
      }).format(Number(value) || 0);
    }

    function getEntries() {
      return loadEntries().sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function updateTypeButtons() {
      typeButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.type === selectedType);
      });
    }

    typeButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedType = button.dataset.type;
        updateTypeButtons();
      });
    });

    function renderSummary(entries) {
      const income = entries
        .filter(item => item.type === "income")
        .reduce((sum, item) => sum + Number(item.amount), 0);

      const expense = entries
        .filter(item => item.type === "expense")
        .reduce((sum, item) => sum + Number(item.amount), 0);

      const balance = income - expense;

      document.getElementById("incomeTotal").textContent = formatCurrency(income);
      document.getElementById("expenseTotal").textContent = formatCurrency(expense);
      document.getElementById("balanceTotal").textContent = formatCurrency(balance);
    }

    function renderTable() {
      const entries = getEntries();
      tableBody.innerHTML = "";

      if (!entries.length) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="empty">아직 저장된 내역이 없습니다.</td>
          </tr>
        `;
        return;
      }

      entries.forEach(entry => {
        const row = document.createElement("tr");
        const typeClass = entry.type === "income" ? "income" : "expense";
        const sign = entry.type === "income" ? "+" : "-";

        row.innerHTML = `
          <td>${entry.date}</td>
          <td><span class="tag ${typeClass}">${entry.type === "income" ? "수입" : "지출"}</span></td>
          <td>${entry.category}</td>
          <td>${entry.memo || "-"}</td>
          <td class="amount ${typeClass}">${sign}${formatCurrency(Number(entry.amount))}</td>
          <td><button class="delete-btn" data-id="${entry.id}">삭제</button></td>
        `;

        tableBody.appendChild(row);
      });

      document.querySelectorAll(".delete-btn").forEach(button => {
        button.addEventListener("click", (event) => {
          const targetId = Number(event.currentTarget.dataset.id);
          const entries = getEntries();
          const filtered = entries.filter(item => item.id !== targetId);
          saveEntries(filtered);
          render();
        });
      });
    }

    function buildYearSelect(entries) {
      const years = [...new Set(entries.map(entry => new Date(entry.date + "T00:00:00").getFullYear()))].sort((a, b) => b - a);
      const current = yearFilter.value;
      yearFilter.innerHTML = '<option value="all">전체</option>' +
        years.map(year => `<option value="${year}">${year}년</option>`).join("");
      yearFilter.value = years.includes(Number(current)) ? String(current) : "all";
    }

    function getFilteredEntries(entries) {
      const selectedYear = yearFilter.value;
      const selectedMonth = monthFilter.value;

      return entries.filter(entry => {
        const date = new Date(entry.date + "T00:00:00");
        const yearMatch = selectedYear === "all" || date.getFullYear() === Number(selectedYear);
        const monthMatch = selectedMonth === "all" || String(date.getMonth() + 1).padStart(2, "0") === selectedMonth;
        return yearMatch && monthMatch;
      });
    }

    function renderOverview() {
      const entries = getEntries();
      buildYearSelect(entries);
      const filteredEntries = getFilteredEntries(entries);

      if (!entries.length) {
        overviewContent.innerHTML = '<div class="empty">아직 저장된 데이터가 없습니다.</div>';
        return;
      }

      const income = filteredEntries
        .filter(item => item.type === "income")
        .reduce((sum, item) => sum + Number(item.amount), 0);

      const expense = filteredEntries
        .filter(item => item.type === "expense")
        .reduce((sum, item) => sum + Number(item.amount), 0);

      const balance = income - expense;
      const average = filteredEntries.length ? (income + expense) / filteredEntries.length : 0;

      const formulaCards = [
        {
          label: "총 수입",
          expression: '=SUMIF(유형, "수입", 금액)',
          result: formatCurrency(income)
        },
        {
          label: "총 지출",
          expression: '=SUMIF(유형, "지출", 금액)',
          result: formatCurrency(expense)
        },
        {
          label: "잔액",
          expression: '=총수입 - 총지출',
          result: formatCurrency(balance)
        },
        {
          label: "평균 거래액",
          expression: '=AVERAGE(금액)',
          result: formatCurrency(average)
        }
      ];

      const rowsHtml = filteredEntries.length
        ? filteredEntries.map(entry => {
            const typeClass = entry.type === "income" ? "income" : "expense";
            return `
              <tr>
                <td>${entry.date}</td>
                <td><span class="tag ${typeClass}">${entry.type === "income" ? "수입" : "지출"}</span></td>
                <td>${entry.category}</td>
                <td>${entry.memo || "-"}</td>
                <td class="amount ${typeClass}">${formatCurrency(Number(entry.amount))}</td>
                <td class="calc-cell">${entry.type === "income" ? "=계산(수입)" : "=계산(지출)"}</td>
                <td class="amount ${typeClass}">${entry.type === "income" ? "+" : "-"}${formatCurrency(Number(entry.amount))}</td>
              </tr>
            `;
          }).join("")
        : `<tr><td colspan="7" class="empty">선택한 연/월에 해당하는 데이터가 없습니다.</td></tr>`;

      overviewContent.innerHTML = `
        <div class="formula-grid">
          ${formulaCards.map(card => `
            <div class="formula-box">
              <span class="formula-label">${card.label}</span>
              <span class="formula-expression">${card.expression}</span>
              <span class="formula-result">${card.result}</span>
            </div>
          `).join("")}
        </div>

        <div class="spreadsheet-table-wrap">
          <table class="spreadsheet-table">
            <thead>
              <tr>
                <th>날짜</th>
                <th>유형</th>
                <th>분류</th>
                <th>메모</th>
                <th>금액</th>
                <th>수식</th>
                <th>결과</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
              <tr class="total-row">
                <td colspan="4">합계</td>
                <td>${formatCurrency(income + expense)}</td>
                <td class="calc-cell">=SUM(금액)</td>
                <td class="amount ${balance >= 0 ? "income" : "expense"}">${formatCurrency(balance)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function render() {
      const entries = getEntries();
      renderSummary(entries);
      renderTable();
      renderOverview();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const date = dateInput.value;
      const category = categoryInput.value.trim();
      const amount = Number(amountInput.value);
      const memo = memoInput.value.trim();

      if (!date || !category || !amount || amount <= 0) {
        return;
      }

      const entries = loadEntries();
      entries.push({
        id: Date.now(),
        date,
        type: selectedType,
        category,
        amount,
        memo
      });

      saveEntries(entries);
      form.reset();
      dateInput.value = new Date().toISOString().slice(0, 10);
      selectedType = "income";
      updateTypeButtons();
      render();
    });

    backupBtn.addEventListener("click", () => {
      const entries = getEntries();
      backupBox.value = JSON.stringify(entries, null, 2);
    });

    restoreBtn.addEventListener("click", () => {
      const text = backupBox.value.trim();
      if (!text) {
        alert("복원할 백업 데이터를 입력해주세요.");
        return;
      }

      try {
        const parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) {
          throw new Error("배열 형식이 아닙니다.");
        }
        saveEntries(parsed);
        render();
        alert("데이터를 복원했습니다.");
      } catch (error) {
        alert("백업 데이터 형식이 올바르지 않습니다.");
      }
    });

    yearFilter.addEventListener("change", renderOverview);
    monthFilter.addEventListener("change", renderOverview);

    updateTypeButtons();
    render();
  </script>
</body>
</html>
