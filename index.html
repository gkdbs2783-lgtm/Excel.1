<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --income: #10b981;
      --expense: #ef4444;
      --primary: #2563eb;
      --shadow: 0 8px 20px rgba(0,0,0,0.06);
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
    }

    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .screen-switch {
      display: inline-flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .switch-btn, .primary-btn, .ghost-btn, .danger-btn {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .switch-btn.active,
    .primary-btn {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .primary-btn { padding: 10px 16px; }
    .ghost-btn { background: #f8fafc; }
    .danger-btn {
      background: rgba(239, 68, 68, 0.08);
      color: var(--expense);
      border-color: rgba(239,68,68,0.12);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
    }

    .card .label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .income .value { color: var(--income); }
    .expense .value { color: var(--expense); }
    .balance .value { color: var(--primary); }

    .content {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 1.2rem;
    }

    .right-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .tab-header {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .tab-btn,
    .overview-btn {
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--muted);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .overview-btn {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      white-space: nowrap;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
      background: white;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.15);
      border-color: var(--primary);
    }

    .type-row {
      display: flex;
      gap: 10px;
    }

    .type-row button {
      flex: 1;
      border: 1px solid var(--line);
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .type-row button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .submit-btn {
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-btn:hover,
    .switch-btn:hover,
    .primary-btn:hover,
    .ghost-btn:hover,
    .danger-btn:hover,
    .overview-btn:hover,
    .tab-btn:hover {
      filter: brightness(0.98);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      background: #f8fafc;
    }

    tbody tr:hover {
      background: #fafcff;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .tag.income {
      background: rgba(16, 185, 129, 0.12);
      color: var(--income);
    }

    .tag.expense {
      background: rgba(239, 68, 68, 0.12);
      color: var(--expense);
    }

    .amount.income { color: var(--income); font-weight: 700; }
    .amount.expense { color: var(--expense); font-weight: 700; }

    .delete-btn {
      border: none;
      background: rgba(239, 68, 68, 0.08);
      color: var(--expense);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 10px;
    }

    .summary-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .overview-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .overview-controls .controls-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .overview-controls label {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .overview-controls select {
      min-width: 120px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .overview-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .overview-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .overview-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      background: white;
    }

    .overview-table th,
    .overview-table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .overview-table th {
      background: #f8fafc;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .summary-row {
      background: #eef6ff;
      font-weight: 700;
    }

    .month-row {
      background: #f9fafb;
      font-weight: 700;
    }

    .year-block {
      margin-bottom: 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .year-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: linear-gradient(180deg, #f8fafc, #eef4ff);
      border-bottom: 1px solid var(--line);
      font-weight: 800;
    }

    .year-summary-mini {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .backup-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 16px;
      overflow: hidden;
    }

    .backup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .backup-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    textarea.backup-box {
      width: 100%;
      min-height: 160px;
      border: none;
      resize: vertical;
      padding: 14px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      background: #f9fafb;
    }

    @media (max-width: 860px) {
      .summary { grid-template-columns: 1fr; }
      .content { grid-template-columns: 1fr; }
      .right-panel-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .overview-btn {
        width: 100%;
      }
      .topbar {
        align-items: flex-start;
      }
      .screen-switch {
        width: 100%;
      }
      .switch-btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title-wrap">
        <h1>가계부</h1>
      </div>
      <div class="screen-switch">
        <button type="button" class="switch-btn active" data-screen="main">입력 화면</button>
        <button type="button" class="switch-btn" data-screen="overview">전체 표 화면</button>
      </div>
    </div>

    <section id="mainScreen" class="screen active">
      <div class="summary">
        <div class="card income">
          <div class="label">수입</div>
          <div class="value" id="incomeTotal">0원</div>
        </div>
        <div class="card expense">
          <div class="label">지출</div>
          <div class="value" id="expenseTotal">0원</div>
        </div>
        <div class="card balance">
          <div class="label">잔액</div>
          <div class="value" id="balanceTotal">0원</div>
        </div>
      </div>

      <div class="content">
        <section class="panel">
          <h2>내역 추가</h2>

          <form id="ledgerForm" class="form-grid">
            <div class="field">
              <label for="date">날짜</label>
              <input type="date" id="date" required />
            </div>

            <div class="field">
              <label>유형</label>
              <div class="type-row">
                <button type="button" class="type-btn active" data-type="income">수입</button>
                <button type="button" class="type-btn" data-type="expense">지출</button>
              </div>
            </div>

            <div class="field">
              <label for="category">분류</label>
              <select id="category" required>
                <option value="급여">급여</option>
                <option value="부업">부업</option>
                <option value="식비">식비</option>
                <option value="교통">교통</option>
                <option value="주거">주거</option>
                <option value="쇼핑">쇼핑</option>
                <option value="통신">통신</option>
                <option value="의료">의료</option>
                <option value="교육">교육</option>
                <option value="기타">기타</option>
              </select>
            </div>

            <div class="field">
              <label for="amount">금액</label>
              <input type="number" id="amount" min="1" step="1" placeholder="예: 50000" required />
            </div>

            <div class="field">
              <label for="memo">메모</label>
              <input type="text" id="memo" maxlength="50" placeholder="예: 점심 식사" />
            </div>

            <button type="submit" class="submit-btn">추가하기</button>
          </form>

          <div class="backup-card">
            <div class="backup-header">
              <strong>데이터 백업</strong>
              <div class="backup-actions">
                <button type="button" class="primary-btn" id="backupBtn">백업 생성</button>
                <button type="button" class="ghost-btn" id="restoreBtn">복원</button>
              </div>
            </div>
            <textarea id="backupBox" class="backup-box" placeholder="백업 데이터를 여기에 붙여 넣고 복원 버튼을 누르세요."></textarea>
          </div>
        </section>

        <section class="panel">
          <div class="right-panel-header">
            <div class="tab-header">
              <button type="button" class="tab-btn active" data-tab="transactions">거래 내역</button>
              <button type="button" class="tab-btn" data-tab="summary">정리 표</button>
            </div>
            <button type="button" class="overview-btn" id="overviewBtn">전체 표 보기</button>
          </div>

          <div id="transactionsPanel" class="tab-panel active">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>날짜</th>
                    <th>유형</th>
                    <th>분류</th>
                    <th>메모</th>
                    <th>금액</th>
                    <th>삭제</th>
                  </tr>
                </thead>
                <tbody id="ledgerTableBody"></tbody>
              </table>
            </div>
          </div>

          <div id="summaryPanel" class="tab-panel">
            <p class="summary-subtitle">상세 항목</p>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>유형</th>
                    <th>분류</th>
                    <th>건수</th>
                    <th>총합</th>
                  </tr>
                </thead>
                <tbody id="summaryTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </section>

    <section id="overviewScreen" class="screen">
      <div class="overview-panel">
        <div class="overview-controls">
          <div class="controls-group">
            <label for="yearFilter">연도</label>
            <select id="yearFilter">
              <option value="all">전체</option>
            </select>
            <label for="monthFilter">월</label>
            <select id="monthFilter">
              <option value="all">전체</option>
              <option value="01">1월</option>
              <option value="02">2월</option>
              <option value="03">3월</option>
              <option value="04">4월</option>
              <option value="05">5월</option>
              <option value="06">6월</option>
              <option value="07">7월</option>
              <option value="08">8월</option>
              <option value="09">9월</option>
              <option value="10">10월</option>
              <option value="11">11월</option>
              <option value="12">12월</option>
            </select>
          </div>
          <div class="controls-group">
            <button type="button" class="ghost-btn" id="backToMainBtn">입력 화면으로</button>
          </div>
        </div>

        <div id="overviewContent"></div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "ledger_entries_v1";
    const form = document.getElementById("ledgerForm");
    const typeButtons = document.querySelectorAll(".type-btn");
    const tabButtons = document.querySelectorAll(".tab-btn");
    const overviewBtn = document.getElementById("overviewBtn");
    const tableBody = document.getElementById("ledgerTableBody");
    const summaryTableBody = document.getElementById("summaryTableBody");
    const dateInput = document.getElementById("date");
    const categoryInput = document.getElementById("category");
    const amountInput = document.getElementById("amount");
    const memoInput = document.getElementById("memo");
    const yearFilter = document.getElementById("yearFilter");
    const monthFilter = document.getElementById("monthFilter");
    const overviewContent = document.getElementById("overviewContent");
    const backupBox = document.getElementById("backupBox");
    const backupBtn = document.getElementById("backupBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const mainScreen = document.getElementById("mainScreen");
    const overviewScreen = document.getElementById("overviewScreen");
    const switchButtons = document.querySelectorAll(".switch-btn");
    const backToMainBtn = document.getElementById("backToMainBtn");

    let selectedType = "income";

    dateInput.value = new Date().toISOString().slice(0, 10);

    function safeStorageGet() {
      try {
        return window.localStorage;
      } catch (error) {
        return {
          store: {},
          getItem(key) { return this.store[key] ?? null; },
          setItem(key, value) { this.store[key] = String(value); },
          removeItem(key) { delete this.store[key]; }
        };
      }
    }

    function loadEntries() {
      const storage = safeStorageGet();
      const raw = storage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveEntries(entries) {
      const storage = safeStorageGet();
      storage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function showScreen(screenName) {
      const isMain = screenName === "main";
      mainScreen.classList.toggle("active", isMain);
      overviewScreen.classList.toggle("active", !isMain);
      switchButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.screen === screenName);
      });
    }

    switchButtons.forEach(button => {
      button.addEventListener("click", () => showScreen(button.dataset.screen));
    });

    backToMainBtn.addEventListener("click", () => showScreen("main"));

    function formatCurrency(value) {
      return new Intl.NumberFormat("ko-KR", {
        style: "currency",
        currency: "KRW",
        maximumFractionDigits: 0
      }).format(value);
    }

    function getEntries() {
      return loadEntries().sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function renderSummary(entries) {
      const income = entries
        .filter(item => item.type === "income")
        .reduce((sum, item) => sum + Number(item.amount), 0);

      const expense = entries
        .filter(item => item.type === "expense")
        .reduce((sum, item) => sum + Number(item.amount), 0);

      const balance = income - expense;

      document.getElementById("incomeTotal").textContent = formatCurrency(income);
      document.getElementById("expenseTotal").textContent = formatCurrency(expense);
      document.getElementById("balanceTotal").textContent = formatCurrency(balance);
    }

    function renderSummaryTable(entries) {
      const summaryMap = new Map();

      entries.forEach(entry => {
        const key = `${entry.type}:${entry.category}`;
        if (!summaryMap.has(key)) {
          summaryMap.set(key, {
            type: entry.type,
            category: entry.category,
            total: 0,
            count: 0
          });
        }

        const summary = summaryMap.get(key);
        summary.total += Number(entry.amount);
        summary.count += 1;
      });

      const rows = [...summaryMap.values()].sort((a, b) => {
        if (a.type !== b.type) return a.type === "income" ? -1 : 1;
        return a.category.localeCompare(b.category, "ko");
      });

      summaryTableBody.innerHTML = "";

      if (!rows.length) {
        summaryTableBody.innerHTML = `
          <tr>
            <td colspan="4" class="empty">아직 정리된 표가 없습니다.</td>
          </tr>
        `;
        return;
      }

      rows.forEach(row => {
        const tr = document.createElement("tr");
        const typeClass = row.type === "income" ? "income" : "expense";
        tr.innerHTML = `
          <td><span class="tag ${typeClass}">${row.type === "income" ? "수입" : "지출"}</span></td>
          <td>${row.category}</td>
          <td>${row.count}건</td>
          <td class="amount ${typeClass}">${row.type === "income" ? "+" : "-"}${formatCurrency(row.total)}</td>
        `;
        summaryTableBody.appendChild(tr);
      });
    }

    function renderTable() {
      const entries = getEntries();
      tableBody.innerHTML = "";

      if (!entries.length) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="empty">아직 저장된 내역이 없습니다.</td>
          </tr>
        `;
        return;
      }

      entries.forEach(entry => {
        const row = document.createElement("tr");
        const typeClass = entry.type === "income" ? "income" : "expense";
        const sign = entry.type === "income" ? "+" : "-";

        row.innerHTML = `
          <td>${entry.date}</td>
          <td><span class="tag ${typeClass}">${entry.type === "income" ? "수입" : "지출"}</span></td>
          <td>${entry.category}</td>
          <td>${entry.memo || "-"}</td>
          <td class="amount ${typeClass}">${sign}${formatCurrency(Number(entry.amount))}</td>
          <td><button class="delete-btn" data-id="${entry.id}">삭제</button></td>
        `;

        tableBody.appendChild(row);
      });

      document.querySelectorAll(".delete-btn").forEach(button => {
        button.addEventListener("click", (event) => {
          const targetId = Number(event.currentTarget.dataset.id);
          const entries = getEntries();
          const filtered = entries.filter(item => item.id !== targetId);
          saveEntries(filtered);
          render();
          renderOverview();
        });
      });
    }

    function buildYearSelect(entries) {
      const years = [...new Set(entries.map(entry => new Date(entry.date + "T00:00:00").getFullYear()))].sort((a, b) => b - a);
      const current = yearFilter.value;
      yearFilter.innerHTML = '<option value="all">전체</option>' +
        years.map(year => `<option value="${year}">${year}년</option>`).join("");
      yearFilter.value = years.includes(Number(current)) ? String(current) : "all";
    }

    function getFilteredEntries(entries) {
      const selectedYear = yearFilter.value;
      const selectedMonth = monthFilter.value;

      return entries.filter(entry => {
        const date = new Date(entry.date + "T00:00:00");
        const yearMatch = selectedYear === "all" || date.getFullYear() === Number(selectedYear);
        const monthMatch = selectedMonth === "all" || String(date.getMonth() + 1).padStart(2, "0") === selectedMonth;
        return yearMatch && monthMatch;
      });
    }

    function renderOverview() {
      const entries = getEntries();
      buildYearSelect(entries);
      const filteredEntries = getFilteredEntries(entries);

      if (!entries.length) {
        overviewContent.innerHTML = '<div class="empty">아직 저장된 데이터가 없습니다.</div>';
        return;
      }

      const grouped = new Map();
      const visibleEntries = filteredEntries.slice().sort((a, b) => new Date(b.date) - new Date(a.date));

      visibleEntries.forEach(entry => {
        const dateObj = new Date(entry.date + "T00:00:00");
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, "0");
        const monthLabel = `${year}년 ${Number(month)}월`;

        if (!grouped.has(year)) {
          grouped.set(year, {
            year,
            totalIncome: 0,
            totalExpense: 0,
            months: new Map()
          });
        }

        const yearBucket = grouped.get(year);
        if (entry.type === "income") yearBucket.totalIncome += Number(entry.amount);
        else yearBucket.totalExpense += Number(entry.amount);

        if (!yearBucket.months.has(month)) {
          yearBucket.months.set(month, {
            month,
            monthLabel,
            income: 0,
            expense: 0,
            records: []
          });
        }

        const monthBucket = yearBucket.months.get(month);
        if (entry.type === "income") monthBucket.income += Number(entry.amount);
        else monthBucket.expense += Number(entry.amount);
        monthBucket.records.push(entry);
      });

      const years = [...grouped.values()].sort((a, b) => b.year - a.year);

      if (!years.length) {
        overviewContent.innerHTML = '<div class="empty">선택한 연/월에 해당하는 데이터가 없습니다.</div>';
        return;
      }

      const summaryHtml = years.map(yearBucket => {
        const months = [...yearBucket.months.values()].sort((a, b) => Number(b.month) - Number(a.month));

        const monthRows = months.map(monthBucket => {
          const rows = monthBucket.records
            .slice()
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .map(entry => `
              <tr>
                <td>${entry.date}</td>
                <td><span class="tag ${entry.type === "income" ? "income" : "expense"}">${entry.type === "income" ? "수입" : "지출"}</span></td>
                <td>${entry.category}</td>
                <td>${entry.memo || "-"}</td>
                <td class="amount ${entry.type === "income" ? "income" : "expense"}">${entry.type === "income" ? "+" : "-"}${formatCurrency(Number(entry.amount))}</td>
              </tr>
            `).join("");

          const monthTotal = monthBucket.income - monthBucket.expense;

          return `
            <tr class="month-row">
              <td colspan="5">${monthBucket.monthLabel} 합계</td>
            </tr>
            <tr class="summary-row">
              <td>요약</td>
              <td>수입</td>
              <td>${formatCurrency(monthBucket.income)}</td>
              <td>지출</td>
              <td>${formatCurrency(monthBucket.expense)}</td>
            </tr>
            <tr class="summary-row">
              <td colspan="3">월 잔액</td>
              <td colspan="2">${formatCurrency(monthTotal)}</td>
            </tr>
            ${rows}
          `;
        }).join("");

        const yearTotal = yearBucket.totalIncome - yearBucket.totalExpense;

        return `
          <div class="year-block">
            <div class="year-header">
              <span>${yearBucket.year}년</span>
              <div class="year-summary-mini">
                <span>수입: ${formatCurrency(yearBucket.totalIncome)}</span>
                <span>지출: ${formatCurrency(yearBucket.totalExpense)}</span>
                <span>잔액: ${formatCurrency(yearTotal)}</span>
              </div>
            </div>
            <div class="overview-table-wrap">
              <table class="overview-table">
                <thead>
                  <tr>
                    <th>날짜</th>
                    <th>유형</th>
                    <th>분류</th>
                    <th>메모</th>
                    <th>금액</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="summary-row">
                    <td colspan="5">${yearBucket.year}년 전체 합계</td>
                  </tr>
                  <tr class="summary-row">
                    <td>수입</td>
                    <td>${formatCurrency(yearBucket.totalIncome)}</td>
                    <td>지출</td>
                    <td>${formatCurrency(yearBucket.totalExpense)}</td>
                    <td>잔액 ${formatCurrency(yearTotal)}</td>
                  </tr>
                  ${monthRows}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join("");

      overviewContent.innerHTML = summaryHtml;
    }

    function render() {
      const entries = getEntries();
      renderSummary(entries);
      renderSummaryTable(entries);
      renderTable();
      renderOverview();
    }

    function makeBackupData() {
      const entries = getEntries();
      return JSON.stringify({
        exportedAt: new Date().toISOString(),
        entries
      }, null, 2);
    }

    backupBtn.addEventListener("click", () => {
      const text = makeBackupData();
      backupBox.value = text;
      navigator.clipboard?.writeText(text).catch(() => {});
      alert("백업 데이터가 생성되었습니다. 복원에 사용할 수 있습니다.");
    });

    restoreBtn.addEventListener("click", () => {
      const raw = backupBox.value.trim();
      if (!raw) {
        alert("복원할 백업 데이터를 입력해 주세요.");
        return;
      }

      try {
        const parsed = JSON.parse(raw);
        const entries = Array.isArray(parsed) ? parsed : parsed.entries;

        if (!Array.isArray(entries)) {
          throw new Error("잘못된 백업 형식입니다.");
        }

        const sanitizedEntries = entries.map((entry, index) => ({
          id: Number(entry.id) || Date.now() + index,
          date: entry.date,
          type: entry.type === "expense" ? "expense" : "income",
          category: entry.category || "기타",
          amount: Number(entry.amount) || 0,
          memo: entry.memo || ""
        })).filter(entry => entry.date && Number(entry.amount) > 0);

        saveEntries(sanitizedEntries);
        render();
        alert("백업 복원이 완료되었습니다.");
      } catch (error) {
        alert("백업 데이터를 읽을 수 없습니다. 형식을 확인해 주세요.");
      }
    });

    yearFilter.addEventListener("change", renderOverview);
    monthFilter.addEventListener("change", renderOverview);

    overviewBtn.addEventListener("click", () => {
      showScreen("overview");
      renderOverview();
    });

    typeButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedType = button.dataset.type;
        typeButtons.forEach(btn => btn.classList.toggle("active", btn === button));
        if (selectedType === "income") {
          categoryInput.value = "급여";
        } else {
          categoryInput.value = "식비";
        }
      });
    });

    tabButtons.forEach(button => {
      button.addEventListener("click", () => {
        tabButtons.forEach(btn => btn.classList.toggle("active", btn === button));
        const target = button.dataset.tab;
        document.getElementById("transactionsPanel").classList.toggle("active", target === "transactions");
        document.getElementById("summaryPanel").classList.toggle("active", target === "summary");
      });
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const date = dateInput.value;
      const amount = Number(amountInput.value);

      if (!date || !amount || amount < 1) {
        alert("날짜와 금액을 올바르게 입력해 주세요.");
        return;
      }

      const entries = getEntries();
      const newEntry = {
        id: Date.now(),
        date,
        type: selectedType,
        category: categoryInput.value,
        amount,
        memo: memoInput.value.trim()
      };

      entries.push(newEntry);
      saveEntries(entries);
      form.reset();
      dateInput.value = new Date().toISOString().slice(0, 10);
      selectedType = "income";
      typeButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.type === "income"));
      categoryInput.value = "급여";
      render();
      renderOverview();
    });

    render();
  </script>
</body>
</html>
